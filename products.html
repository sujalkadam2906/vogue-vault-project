<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Collection: VOGUE VAULT</title>
  <meta name="description" content="Browse the complete catalog of apparel, denim, jackets, and footwear at VOGUE VAULT." />
  <link rel="stylesheet" href="styles/variables.css" />
  <link rel="stylesheet" href="styles/reset.css" />
  <link rel="stylesheet" href="styles/global.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/pages.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#3B2A20" />
  <link rel="canonical" href="https://YOURDOMAIN.com/products.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Shop Collection: VOGUE VAULT" />
  <meta property="og:description" content="Browse the complete catalog of apparel, denim, jackets, and footwear at VOGUE VAULT." />
  <meta property="og:url" content="https://YOURDOMAIN.com/products.html" />
  <meta property="og:site_name" content="VOGUE VAULT" />
</head>
<body>
  <div id="header"></div>
  <main class="page-container">
    <header class="page-header">
      <h1 id="catalogue-heading">All Products</h1>
    </header>

    <div class="catalogue-toolbar">
      <div class="filter-group">
        <label for="filter-search" class="visually-hidden">Search products</label>
        <input type="search" id="filter-search" class="input-control" placeholder="Search by name or brand..." />

        <label for="filter-gender" class="visually-hidden">Filter by gender</label>
        <select id="filter-gender" class="select-control">
          <option value="">All Genders</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Unisex">Unisex</option>
        </select>

        <label for="filter-category" class="visually-hidden">Filter by category</label>
        <select id="filter-category" class="select-control">
          <option value="">All Categories</option>
        </select>

        <label for="filter-sort" class="visually-hidden">Sort products</label>
        <select id="filter-sort" class="select-control">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A to Z</option>
        </select>
      </div>

      <div class="toolbar-results-count" id="results-count" aria-live="polite"></div>
    </div>

    <div id="product-list"></div>
  </main>
  <div id="footer"></div>
  <div class="toast-container"></div>
  <script type="module" src="src/pages/products.js"></script>
</body>
</html>
